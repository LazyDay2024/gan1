<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Math Battle Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e3c72, #2a5298, #0f2027);
      font-family: 'Trebuchet MS', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    h1 {
      margin: 20px 0;
      font-size: 3rem;
      color: #ffdd00;
      text-shadow: 0 0 10px #ff8c00, 0 0 20px #ff6600;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ffdd00, 0 0 20px #ff6600; }
      to   { text-shadow: 0 0 20px #ffe066, 0 0 40px #ff3300; }
    }
    #game {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      text-align: center;
      margin-top: 10px;
    }
    #status { margin: 15px 0; font-size: 1.3rem; font-weight: bold; color: #ffd700; text-shadow: 1px 1px 3px #000; }
    #question { font-size: 2rem; margin: 20px 0; color: #00e6ff; text-shadow: 0 0 10px #00ccff; }
    .choice {
      display: inline-block; margin: 10px; padding: 15px 30px;
      border: none; border-radius: 15px;
      background: linear-gradient(135deg, #ffcc00, #ff8800);
      color: #000; font-size: 1.2rem; font-weight: bold;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .choice:hover {
      transform: translateY(-5px) scale(1.05);
      background: linear-gradient(135deg, #ffee00, #ff5500);
      box-shadow: 0 0 20px #ff6600;
    }
    #leaderboard {
      margin-top: 25px; background: rgba(0, 0, 0, 0.5);
      border: 2px solid #ffcc00; border-radius: 15px;
      padding: 15px; max-width: 400px; text-align: center;
    }
    #leaderboard h3 { color: #ffcc00; text-shadow: 1px 1px 5px #000; margin-bottom: 10px; }
    #scoresList { list-style: none; font-size: 1.1rem; }
    #scoresList li { padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.2); }
    #scoresList li:nth-child(1) { color: #ffd700; font-weight: bold; text-shadow: 0 0 10px #ffaa00; }
    #scoresList li:nth-child(2) { color: #c0c0c0; }
    #scoresList li:nth-child(3) { color: #cd7f32; }
  </style>
</head>
<body>
  <h1>⚔ Math Battle Arena ⚔</h1>
  <div id="game">
    <div id="status">
      เวลา: <span id="time">10</span>s | คะแนน: <span id="score">0</span>
    </div>
    <div id="question">เริ่มเกมกดปุ่มด้านล่าง</div>
    <div id="choices"></div>
    <button id="startBtn" class="choice">▶ เริ่มเกม</button>
  </div>

  <div id="leaderboard">
    <h3>🏆 High Score (Local) 🏆</h3>
    <ol id="scoresList"></ol>
  </div>

  <!-- ✅ สถิติจาก Database -->
  <div id="stats" style="margin-top:20px; font-size:1.2rem; color:#00ffcc;">
    กำลังโหลดสถิติ...
  </div>

  <script>
    let time = 10;
    let score = 0;
    let timer;
    let highScores = [];

    const timeEl = document.getElementById("time");
    const scoreEl = document.getElementById("score");
    const questionEl = document.getElementById("question");
    const choicesEl = document.getElementById("choices");
    const startBtn = document.getElementById("startBtn");
    const scoresList = document.getElementById("scoresList");

    function startGame() {
      time = 10;
      score = 0;
      updateStatus();
      startBtn.style.display = "none";
      nextQuestion();
      timer = setInterval(() => {
        time--;
        updateStatus();
        if (time <= 0) endGame();
      }, 1000);
    }

    function updateStatus() {
      timeEl.textContent = time;
      scoreEl.textContent = score;
    }

    function nextQuestion() {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      const answer = a * b; // โจทย์เป็นคูณ

      questionEl.textContent = `${a} × ${b} = ?`;
      choicesEl.innerHTML = "";

      let answers = [answer];
      while (answers.length < 4) {
        let wrong = Math.floor(Math.random() * 100);
        if (!answers.includes(wrong)) answers.push(wrong);
      }
      answers.sort(() => Math.random() - 0.5);

      answers.forEach(num => {
        const btn = document.createElement("button");
        btn.textContent = num;
        btn.className = "choice";
        btn.onclick = () => checkAnswer(num, answer);
        choicesEl.appendChild(btn);
      });
    }

    function checkAnswer(choice, answer) {
      if (choice === answer) {
        score += 10;
      } else {
        score -= 5;
        if (score < 0) score = 0;
      }
      updateStatus();
      nextQuestion();
    }

    function endGame() {
      clearInterval(timer);
      questionEl.textContent = "⏰ หมดเวลา!";
      choicesEl.innerHTML = "";
      startBtn.style.display = "inline-block";

      let name = prompt("ใส่ชื่อเพื่อบันทึกคะแนน:");
      if (name) {
        // เก็บ local
        highScores.push({ name, score });
        highScores.sort((a, b) => b.score - a.score);
        if (highScores.length > 5) highScores.pop();
        renderScores();

        // ✅ บันทึกลง Firebase ด้วย
        saveScore(name, score).then(() => loadStats());
      }
    }

    function renderScores() {
      scoresList.innerHTML = "";
      highScores.forEach(s => {
        const li = document.createElement("li");
        li.textContent = `${s.name} - ${s.score}`;
        scoresList.appendChild(li);
      });
    }

    startBtn.addEventListener("click", startGame);
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } 
      from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "xxxxxxx",
      appId: "xxxxxxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ✅ บันทึกคะแนน
    window.saveScore = async function(name, score) {
      try {
        await addDoc(collection(db, "scores"), {
          name: name,
          score: score,
          time: new Date()
        });
        console.log("บันทึกคะแนนแล้ว");
      } catch (e) {
        console.error("ผิดพลาด:", e);
      }
    }

    // ✅ โหลดสถิติ
    window.loadStats = async function() {
      const querySnapshot = await getDocs(collection(db, "scores"));
      let allScores = [];
      querySnapshot.forEach(doc => {
        allScores.push(doc.data().score);
      });

      let avg = 0;
      if (allScores.length > 0) {
        avg = allScores.reduce((a,b)=>a+b,0)/allScores.length;
      }

      document.getElementById("stats").innerHTML =
        `จำนวนผู้เล่น: ${allScores.length} <br> คะแนนเฉลี่ย: ${avg.toFixed(2)}`;
    }

    // โหลดสถิติทันทีตอนเปิดเว็บ
    loadStats();
  </script>
</body>
</html>
