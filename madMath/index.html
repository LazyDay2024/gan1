<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Math Battle Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⚔ Math Battle Arena ⚔</h1>
  <div id="game">
    <div id="status">
      เวลา: <span id="time">10</span>s | คะแนน: <span id="score">0</span>
    </div>
    <div id="question">เริ่มเกมกดปุ่มด้านล่าง</div>
    <div id="choices"></div>
    <button id="startBtn" class="choice">▶ เริ่มเกม</button>
  </div>

  <div id="leaderboard">
    <h3>🏆 High Score (Local) 🏆</h3>
    <ol id="scoresList"></ol>
  </div>

  <div id="stats" style="margin-top:20px; font-size:1.2rem; color:#00ffcc;">
    กำลังโหลดสถิติ...
  </div>

  <!-- script -->
  <script src="game.js"></script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
